<!doctype html><html lang="en"><meta charset="utf-8"><title>Nowly deterministic vertical scroll target</title><style>html{scroll-behavior:auto}body{margin:0;font:16px Arial;background:#fff;color:#211f1c}.row{height:72px;box-sizing:border-box;border-bottom:1px solid #ddd;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}.signature{display:flex;gap:3px}.signature i{display:block;width:24px;height:24px}#nested{height:480px;overflow:auto;border:1px solid #777}.fixed{position:fixed;top:0;left:0;right:0;height:48px;background:white;z-index:2}</style><body><main id="content"></main><script>
const q=new URLSearchParams(location.search),content=document.querySelector('#content');let state=0x715ab39;
function next(){state^=state<<13;state^=state>>>17;state^=state<<5;return state>>>0}
const rows=Number(q.get('rows')||120);let host=content;

if(q.has('fixed')){const fixed=document.createElement('header');fixed.className='fixed';fixed.textContent='Fixed chrome: expected conservative refusal; select below this header.';content.append(fixed)}
window.fixture={rows,rowHeight:72,scrollTarget:host===content?document.scrollingElement:host};
</script></body></html>
