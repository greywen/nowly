<style>
:root{--primary:#009ef7;--primary-dark:#0878b9;--text:#181c32;--muted:#7e8299;--surface:#fff;--canvas:#f5f8fa;--border:#eff2f5;--success:#50cd89;--warning:#ffc700;--danger:#f1416c;--purple:#7239ea;--shadow:0 10px 30px rgba(76,87,125,.09)}
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--canvas)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}:where(button,input,textarea,select):focus-visible{outline:3px solid rgba(0,158,247,.28);outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.app-shell{width:100vw;height:100vh;padding:22px;overflow:hidden;background:radial-gradient(circle at 12% 0,rgba(0,158,247,.13),transparent 29%),radial-gradient(circle at 92% 7%,rgba(80,205,137,.11),transparent 26%),linear-gradient(135deg,#f9fbfd,#edf3f7);transition:background .18s ease}.app-shell__inner{height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px;margin:auto}.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:24px}.today{display:flex;align-items:flex-end;gap:16px;min-width:0}.time{font-size:44px;line-height:.9;letter-spacing:-.045em;font-weight:800}.date-copy{min-width:0}.date-copy strong{font-size:15px}.date-copy p{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:600}.top-actions,.toolbar-actions{display:flex;align-items:center;gap:9px}.btn{border:0;border-radius:10px;min-height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#5e6278;font-size:13px;font-weight:700;box-shadow:0 2px 9px rgba(76,87,125,.07)}.btn:hover{color:var(--primary);background:#f1faff}.btn-icon{width:38px;padding:0}.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(0,158,247,.22)}.btn-primary:hover{background:#008ee0;color:#fff}.workspace{min-width:0;min-height:0;flex:1;display:grid;grid-template-columns:minmax(620px,1.58fr) minmax(320px,.72fr);gap:16px}.card{min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(239,242,245,.96);border-radius:18px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);transition:background .18s,box-shadow .18s}.card-header{height:72px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border)}.heading-group h1,.heading-group h2{margin:0;font-size:19px;letter-spacing:-.02em}.heading-group p{margin:5px 0 0;color:var(--muted);font-size:11px;font-weight:600}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:5px 8px;background:#f1faff;color:var(--primary-dark);font-size:10px;font-weight:800}.calendar-card{display:flex;flex-direction:column}.calendar-body{min-height:0;flex:1;padding:0 14px 14px;display:flex;flex-direction:column}.weekdays{height:36px;flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center}.weekdays span{text-align:center;color:#a1a5b7;font-size:10px;font-weight:800}.calendar-grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border);border-radius:12px;overflow:hidden}.day{min-width:0;min-height:0;padding:7px;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(255,255,255,.5);text-align:left;overflow:hidden}.day:nth-child(7n),.day:nth-child(7n-1){background:#fbfcfd}.day.outside{color:#c7cbd5;background:#fafbfc}.day.today{background:#f1faff;box-shadow:inset 0 0 0 1px rgba(0,158,247,.35)}.day-number{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;font-size:11px;font-weight:800}.today .day-number{background:var(--primary);color:#fff}.event{width:100%;height:21px;margin-top:4px;padding:0 6px;border:0;border-radius:6px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-size:9px;font-weight:750}.event--work{color:#0878b9;background:#e9f6ff}.event--important{color:#c62f55;background:#fff0f4}.event--personal{color:#238c5a;background:#e8fff3}.event--learning{color:#6030bf;background:#f4efff}.more{margin:4px 2px 0;color:var(--muted);font-size:9px;font-weight:700}.side-column{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1.18fr) minmax(0,.82fr);gap:16px}.priority-card,.notes-card{display:flex;flex-direction:column}.panel-body{min-height:0;flex:1;padding:12px 14px 14px;overflow:auto}.quadrant-grid{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px}.quadrant{min-width:0;min-height:0;padding:10px;border-radius:12px;overflow:hidden}.q-danger{background:#fff5f8}.q-primary{background:#f1faff}.q-warning{background:#fff8dd}.q-neutral{background:#f5f8fa}.quadrant-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}.quadrant h3{margin:0;font-size:10px}.count{font-size:9px;color:var(--muted);font-weight:800}.task{display:flex;align-items:flex-start;gap:6px;padding:5px 0}.task input{width:14px;height:14px;margin:1px 0 0;accent-color:var(--primary)}.task-copy{min-width:0}.task-title{display:block;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{display:block;margin-top:2px;color:var(--muted);font-size:8px}.notes-list{display:grid;gap:9px}.note{width:100%;border:0;border-radius:11px;padding:10px 11px;text-align:left}.note--yellow{background:#fff8dd}.note--blue{background:#eef8ff}.note-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.note-title{font-size:11px;font-weight:800}.note p{margin:5px 0;color:#5e6278;font-size:9px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.note-meta{font-size:8px;color:var(--muted)}.link-btn{border:0;background:transparent;color:var(--primary-dark);font-size:10px;font-weight:750}.app-shell[data-theme="desktop"]{background:radial-gradient(circle at 15% 18%,rgba(0,158,247,.65),transparent 25%),radial-gradient(circle at 82% 12%,rgba(114,57,234,.6),transparent 30%),radial-gradient(circle at 64% 86%,rgba(80,205,137,.35),transparent 24%),linear-gradient(145deg,#13223b,#2d365b 52%,#182942)}.app-shell[data-theme="desktop"] .card{background:rgba(255,255,255,.84);border-color:rgba(255,255,255,.64);box-shadow:0 18px 48px rgba(10,20,38,.28);backdrop-filter:blur(18px) saturate(120%)}.app-shell[data-theme="desktop"] .btn:not(.btn-primary){background:rgba(255,255,255,.88)}
@media(max-width:1500px),(max-height:850px){.app-shell{padding:12px}.app-shell__inner{gap:10px}.workspace,.side-column{gap:10px}.workspace{grid-template-columns:minmax(570px,1.52fr) minmax(310px,.72fr)}.time{font-size:34px}.date-copy p{margin-top:3px}.card{border-radius:14px}.card-header{height:56px;padding:9px 12px}.heading-group h1,.heading-group h2{font-size:15px}.heading-group p{margin-top:2px}.calendar-body{padding:0 9px 9px}.weekdays{height:26px}.day{padding:4px}.day-number{width:19px;height:19px;font-size:9px}.event{height:17px;margin-top:2px;font-size:8px}.event:nth-of-type(n+3),.density-optional{display:none}.panel-body{padding:8px}.quadrant-grid{gap:6px}.quadrant{padding:7px}.quadrant-head{margin-bottom:3px}.task{padding:3px 0}.notes-list{gap:6px}.note{padding:7px 9px}.btn{min-height:32px;padding:0 10px}.btn-icon{width:32px}}
@media(min-width:2200px){.app-shell__inner{width:min(2200px,calc(100vw - 80px))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<svg class="sr-only" aria-hidden="true"><defs>
<symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol><symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z"/></symbol><symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="m12 17-5 5M5 3l6 6M14 3l7 7-4 1-5 5-4-4 5-5 1-4Z"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></symbol>

<div class="app-shell" data-theme="light">
<div class="app-shell__inner">
<header class="topbar"><div class="today"><div class="time">09:41</div><div class="date-copy"><strong>2026 年 7 月 23 日，星期四</strong><p>今天有 3 个日程 · 2 个重要任务 · 2 条便签</p></div></div><nav class="top-actions" aria-label="界面操作"><button class="btn" type="button" data-action="toggle-theme" aria-label="切换到桌面融合模式" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span>桌面融合</span></button><button class="btn btn-icon" type="button" aria-label="打开设置"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button><button class="btn btn-primary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg>设为壁纸</button></nav></header>
<main class="workspace">
<section class="card calendar-card" aria-labelledby="calendar-title"><header class="card-header"><div class="heading-group"><h1 id="calendar-title">2026 年 7 月</h1><p><span class="badge">本月 12 个日程</span></p></div><div class="toolbar-actions"><button class="btn btn-icon" aria-label="上一个月"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><button class="btn">今天</button><button class="btn btn-icon" aria-label="下一个月"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></button><button class="btn btn-primary"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>新建日程</button></div></header><div class="calendar-body"><div class="weekdays" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div class="calendar-grid" data-testid="calendar-grid" aria-label="2026 年 7 月月历" id="calendar-grid"></div></div></section>
<aside class="side-column"><section class="card priority-card" aria-labelledby="priority-title"><header class="card-header"><div class="heading-group"><h2 id="priority-title">优先事项</h2><p>4 项待处理 · 1 项今天到期</p></div><button class="btn btn-icon" aria-label="新增任务"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button></header><div class="panel-body"><div class="quadrant-grid" data-testid="quadrant-grid"><section class="quadrant q-danger" data-quadrant><div class="quadrant-head"><h3>重要且紧急</h3><span class="count">1</span></div><label class="task"><input type="checkbox"><span class="task-copy"><span class="task-title">发布 Nowly v0.1</span><span class="task-meta">今天 18:00 到期</span></span></label></section><section class="quadrant q-primary" data-quadrant><div class="quadrant-head"><h3>重要不紧急</h3><span class="count">1</span></div><label class="task"><input type="checkbox"><span class="task-copy"><span class="task-title">完善模块接口设计</span><span class="task-meta">本周五前完成</span></span></label></section><section class="quadrant q-warning" data-quadrant><div class="quadrant-head"><h3>不重要但紧急</h3><span class="count">1</span></div><label class="task"><input type="checkbox"><span class="task-copy"><span class="task-title">回复合作方消息</span><span class="task-meta">今天处理</span></span></label></section><section class="quadrant q-neutral" data-quadrant><div class="quadrant-head"><h3>不重要不紧急</h3><span class="count">1</span></div><label class="task"><input type="checkbox"><span class="task-copy"><span class="task-title">整理参考素材</span><span class="task-meta">无截止时间</span></span></label></section></div></div></section>
<section class="card notes-card" aria-labelledby="notes-title"><header class="card-header"><div class="heading-group"><h2 id="notes-title">便签</h2><p>1 条置顶 · 最近更新 09:10</p></div><button class="btn btn-icon" aria-label="新增便签"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button></header><div class="panel-body"><div class="notes-list"><button class="note note--yellow" data-note-card><span class="note-head"><span class="note-title">产品原则</span><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg></span><p>只有一个主界面，所有新增、编辑和查看操作均通过弹窗完成。</p><span class="note-meta">置顶 · 09:00 更新</span></button><button class="note note--blue" data-note-card><span class="note-head"><span class="note-title">本周提醒</span></span><p>完成最终 UI 验收，准备本地数据层和桌面模式联调。</p><span class="note-meta">09:10 更新</span></button><button class="link-btn">查看全部便签</button></div></div></section></aside>
</main></div></div>
<script>
const shell=document.querySelector('.app-shell');const themeButton=document.querySelector('[data-action="toggle-theme"]');themeButton.addEventListener('click',()=>{const desktop=shell.dataset.theme!=='desktop';shell.dataset.theme=desktop?'desktop':'light';themeButton.setAttribute('aria-pressed',String(desktop));themeButton.setAttribute('aria-label',desktop?'切换到浅色渐变模式':'切换到桌面融合模式');themeButton.querySelector('span').textContent=desktop?'浅色渐变':'桌面融合'});
const events={2:[['10:00 产品复盘','work']],7:[['全天 项目里程碑','important']],10:[['20:00 阅读时间','learning']],17:[['09:30 站会','work']],24:[['09:30 站会','work'],['14:00 设计评审','important'],['18:30 健身','personal']],29:[['18:30 健身','personal']]};const grid=document.getElementById('calendar-grid');const dates=[];for(let d=29;d<=30;d++)dates.push({d,out:true,month:'6月'});for(let d=1;d<=31;d++)dates.push({d,out:false,month:'7月'});for(let d=1;d<=2;d++)dates.push({d,out:true,month:'8月'});dates.forEach((item,index)=>{const day=document.createElement('div');day.className='day'+(item.out?' outside':'')+(item.d===23&&!item.out?' today':'');day.dataset.calendarDay='';if(item.d===23&&!item.out)day.setAttribute('aria-current','date');const dateButton=document.createElement('button');dateButton.className='day-number';dateButton.type='button';dateButton.setAttribute('aria-label',item.d===23&&!item.out?'2026年7月23日，星期四':`2026年${item.month}${item.d}日`);dateButton.textContent=item.d;day.append(dateButton);(events[index]||[]).forEach(([label,type])=>{const event=document.createElement('button');event.type='button';event.className=`event event--${type}`;event.setAttribute('aria-label',label);event.textContent=label;day.append(event)});if(index===24){const more=document.createElement('div');more.className='more';more.textContent='还有 2 项';day.append(more)}grid.append(day)});
</script>
