<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
*{margin:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#F8F6F2}
#root{position:relative;width:1920px;height:1080px}.film-frame{position:absolute;inset:0;width:1920px;height:1080px;object-fit:contain}
#layout-proof{position:absolute;left:112px;top:264px;width:1696px;height:720px;object-fit:contain;z-index:2}
#lt-clean-bar{z-index:3}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080" data-fps="30">
<img id="intro-image" class="clip film-frame" data-start="0" data-duration="4" data-track-index="0" data-hold src="assets/landscape-intro.png" alt="Nowly 中文工作区">
<img id="demo-ground" class="clip film-frame" data-start="4" data-duration="16" data-track-index="0" src="assets/landscape-video.png" alt="">
<video id="layout-proof" class="clip" data-start="4" data-duration="16" data-media-start="4" data-track-index="1" muted playsinline src="assets/customize-layout.mp4"></video>
<img id="tasks-image" class="clip film-frame" data-start="20" data-duration="5" data-track-index="0" data-hold src="assets/landscape-tasks.png" alt="当前看板界面">
<img id="focus-image" class="clip film-frame" data-start="25" data-duration="5" data-track-index="0" data-hold src="assets/landscape-focus.png" alt="专注计时局部">
<img id="end-image" class="clip film-frame" data-start="30" data-duration="6" data-track-index="0" data-hold src="assets/landscape-end.png" alt="Nowly 标识">
<div id="lt-clean-bar" class="clip" data-composition-id="lt-clean-bar" data-composition-src="compositions/lt-clean-bar.html" data-start="0" data-duration="36" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>
</div>
<script>window.__timelines=window.__timelines||{};window.__timelines.main=gsap.timeline({paused:true});</script>
</body></html>
