<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#F8F6F2}
#root{position:relative;width:1080px;height:1920px}.film-frame{position:absolute;inset:0;width:1080px;height:1920px;object-fit:contain}
#portrait-layout-proof{position:absolute;left:76px;top:550px;width:856px;height:640px;object-fit:contain;z-index:2}
#portrait-captions{z-index:3}
</style>
</head>
<body>
<div id="root" data-composition-id="portrait" data-start="0" data-duration="36" data-width="1080" data-height="1920" data-fps="30">
<img id="portrait-intro-image" class="clip film-frame" data-start="0" data-duration="4" data-track-index="0" data-hold src="assets/portrait-intro.png" alt="Nowly 中文工作区">
<img id="portrait-demo-ground" class="clip film-frame" data-start="4" data-duration="16" data-track-index="0" src="assets/portrait-video.png" alt="">
<video id="portrait-layout-proof" class="clip" data-start="4" data-duration="16" data-media-start="4" data-track-index="1" muted playsinline src="assets/customize-layout.mp4"></video>
<img id="portrait-tasks-image" class="clip film-frame" data-start="20" data-duration="5" data-track-index="0" data-hold src="assets/portrait-tasks.png" alt="当前看板界面">
<img id="portrait-focus-image" class="clip film-frame" data-start="25" data-duration="5" data-track-index="0" data-hold src="assets/portrait-focus.png" alt="专注计时局部">
<img id="portrait-end-image" class="clip film-frame" data-start="30" data-duration="6" data-track-index="0" data-hold src="assets/portrait-end.png" alt="Nowly 标识">
<div id="portrait-captions" class="clip" data-composition-id="portrait-captions" data-composition-src="compositions/portrait-captions.html" data-start="0" data-duration="36" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>
</div>
<script>window.__timelines=window.__timelines||{};window.__timelines.portrait=gsap.timeline({paused:true});</script>
</body></html>
