name: Release

# Builds the Windows executable and publishes a GitHub Release every time
# code lands on main. The release version comes from package.json: the first
# run ships that version as-is (0.1.0), and each later merge auto-bumps the
# patch number so every release is unique. Release notes are generated by an
# LLM that analyses the commits since the previous release.
on:
  push:
    branches:
      - main

# Avoid overlapping release runs stepping on each other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Skip the run that our own version-bump commit creates.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Record previous tag
        id: prevtag
        shell: bash
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Prepare release version
        id: version
        shell: bash
        run: node .github/scripts/prepare-version.mjs

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main

      - name: Resolve release commit
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.prevtag.outputs.tag }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node .github/scripts/generate-release-notes.mjs

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nowly ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          target_commitish: ${{ steps.sha.outputs.sha }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
