name: Release

# Builds the Windows executable and publishes a GitHub Release every time
# code lands on main. The release version is derived from the existing git
# tags (with package.json's version as the floor) and injected into the
# manifests for the build only -- nothing is committed or pushed back to a
# branch. Release notes are generated by an LLM that analyses the commits
# since the previous release.
on:
  push:
    branches:
      - main

# Avoid overlapping release runs stepping on each other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Record previous tag
        id: prevtag
        shell: bash
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Prepare release version
        id: version
        shell: bash
        run: node .github/scripts/prepare-version.mjs

      - name: Verify version sync
        shell: bash
        run: node scripts/check-version-sync.mjs

      - name: Resolve release commit
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.prevtag.outputs.tag }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Azure AI endpoint + model. These are not secrets, so they live here.
          # A repository secret of the same name still overrides them if set.
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://grey-resource.services.ai.azure.com/openai/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-5.4-mini' }}
        run: node .github/scripts/generate-release-notes.mjs

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nowly ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          target_commitish: ${{ steps.sha.outputs.sha }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
